<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coding Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .topic-group {
      margin-bottom: 2rem;
    }
    label {
      display: block;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Coding Progress Tracker</h1>
  </header>
  <main>

    <section class="topic-group">
      <h2>Advanced C# Topics</h2>
      <label><input type="checkbox" data-id="csharp-1"> Dependency Injection</label>
      <label><input type="checkbox" data-id="csharp-2"> Configuration & AppSettings</label>
      <label><input type="checkbox" data-id="csharp-3"> Logging in ASP.NET Core</label>
      <label><input type="checkbox" data-id="csharp-4"> Async / Await</label>
      <label><input type="checkbox" data-id="csharp-5"> Writing Unit Tests</label>
    </section>

    <section class="topic-group">
      <h2>LINQ Mastery (Kudvenkat Playlist)</h2>
      <label><input type="checkbox" data-id="linq-1"> LINQ Basics (Where, Select, FirstOrDefault)</label>
      <label><input type="checkbox" data-id="linq-2"> LINQ with Navigation Properties</label>
      <label><input type="checkbox" data-id="linq-3"> GroupBy & Aggregates</label>
      <label><input type="checkbox" data-id="linq-4"> Joins & Projections into DTO</label>
      <label><input type="checkbox" data-id="linq-5"> Advanced Methods (.Any, .All…)</label>
      <label><input type="checkbox" data-id="linq-6"> LINQ Performance Optimization</label>
      <label><input type="checkbox" data-id="linq-7"> Query vs Method Syntax</label>
    </section>

    <section class="topic-group">
      <h2>Entity Framework Core</h2>
      <label><input type="checkbox" data-id="ef-1"> Code First + Migrations</label>
      <label><input type="checkbox" data-id="ef-2"> Seeding the Database</label>
      <label><input type="checkbox" data-id="ef-3"> Relationships (One-to-Many, Many-to-Many)</label>
      <label><input type="checkbox" data-id="ef-4"> Tracking vs NoTracking</label>
      <label><input type="checkbox" data-id="ef-5"> Querying with LINQ</label>
    </section>

    <section class="topic-group">
      <h2>ASP.NET Core Web API</h2>
      <label><input type="checkbox" data-id="api-1"> Creating a REST API</label>
      <label><input type="checkbox" data-id="api-2"> Attribute Routing</label>
      <label><input type="checkbox" data-id="api-3"> Versioning APIs</label>
      <label><input type="checkbox" data-id="api-4"> JWT Authentication</label>
      <label><input type="checkbox" data-id="api-5"> Role-based Authorization</label>
      <label><input type="checkbox" data-id="api-6"> File Upload / Download</label>
    </section>

    <section class="topic-group">
      <h2>Angular Basics</h2>
      <label><input type="checkbox" data-id="ng-1"> What is Angular? Setup & CLI</label>
      <label><input type="checkbox" data-id="ng-2"> Components & Templates</label>
      <label><input type="checkbox" data-id="ng-3"> Data Binding</label>
      <label><input type="checkbox" data-id="ng-4"> Directives</label>
      <label><input type="checkbox" data-id="ng-5"> Services & Dependency Injection</label>
      <label><input type="checkbox" data-id="ng-6"> Routing & Navigation</label>
      <label><input type="checkbox" data-id="ng-7"> Forms (Template-driven & Reactive)</label>
    </section>

    <section class="topic-group">
      <h2>Angular Advanced</h2>
      <label><input type="checkbox" data-id="ng-adv-1"> RxJS Basics</label>
      <label><input type="checkbox" data-id="ng-adv-2"> State Management (NgRx or Services)</label>
      <label><input type="checkbox" data-id="ng-adv-3"> Angular Performance Tips</label>
    </section>

    <p><a href="index.html">Back to Weekly Schedule</a></p>
  </main>

  <script>
    // Persist checkbox state using localStorage
    document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
      const id = checkbox.dataset.id;
      if (localStorage.getItem(id) === "true") {
        checkbox.checked = true;
      }
      checkbox.addEventListener('change', () => {
        localStorage.setItem(id, checkbox.checked);
      });
    });
  </script>
</body>
</html>
