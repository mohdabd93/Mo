<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Communication Skills Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    .topic-group { margin-bottom: 2rem; }
    label { display: block; margin: 0.5rem 0; }
    a.source-link { font-size: 0.9rem; color: #0077cc; text-decoration: none; margin-left: 1.2rem; }
    a.source-link:hover { text-decoration: underline; }
    header, footer { text-align: center; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <header><h1>Communication Skills Tracker</h1></header>
  <main>
    <section class="topic-group">
      <h2>Fundamentals of Communication</h2>
      <label><input type="checkbox" data-id="comm-1"> Basics of Effective Communication
        <a href="https://www.mindtools.com/pages/article/newCS_99.htm" target="_blank" class="source-link">MindTools Article</a>
      </label>
      <label><input type="checkbox" data-id="comm-2"> Active Listening Skills
        <a href="https://www.skillsyouneed.com/ips/active-listening.html" target="_blank" class="source-link">SkillsYouNeed</a>
      </label>
      <label><input type="checkbox" data-id="comm-3"> Non-verbal Communication
        <a href="https://www.helpguide.org/articles/relationships-communication/nonverbal-communication.htm" target="_blank" class="source-link">HelpGuide</a>
      </label>
      <label><input type="checkbox" data-id="comm-4"> Giving & Receiving Feedback
        <a href="https://www.thebalancecareers.com/giving-feedback-to-employees-2276092" target="_blank" class="source-link">The Balance Careers</a>
      </label>
    </section>

    <section class="topic-group">
      <h2>Presentation Skills</h2>
      <label><input type="checkbox" data-id="comm-5"> Structuring Your Presentation
        <a href="https://www.toastmasters.org/resources/resource-library" target="_blank" class="source-link">Toastmasters Resources</a>
      </label>
      <label><input type="checkbox" data-id="comm-6"> Body Language Tips
        <a href="https://www.ted.com/talks/amy_cuddy_your_body_language_shapes_who_you_are" target="_blank" class="source-link">TED Talk Amy Cuddy</a>
      </label>
      <label><input type="checkbox" data-id="comm-7"> Handling Q&A Sessions
        <a href="https://www.inc.com/guides/2010/06/handling-questions-in-a-presentation.html" target="_blank" class="source-link">Inc.com Guide</a>
      </label>
    </section>

    <section class="topic-group">
      <h2>Interpersonal Communication</h2>
      <label><input type="checkbox" data-id="comm-8"> Building Rapport
        <a href="https://www.psychologytoday.com/us/blog/conscious-communication/201812/how-build-rapport" target="_blank" class="source-link">Psychology Today</a>
      </label>
      <label><input type="checkbox" data-id="comm-9"> Conflict Resolution
        <a href="https://www.mindtools.com/pages/article/newLDR_81.htm" target="_blank" class="source-link">MindTools Conflict Resolution</a>
      </label>
      <label><input type="checkbox" data-id="comm-10"> Negotiation Basics
        <a href="https://www.coursera.org/learn/negotiation-skills" target="_blank" class="source-link">Coursera Free Course</a>
      </label>
    </section>

    <p><a href="index.html">Back to Weekly Schedule</a></p>
  </main>

  <script>
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      const id = cb.dataset.id;
      if(localStorage.getItem(id) === "true") cb.checked = true;
      cb.addEventListener('change', () => localStorage.setItem(id, cb.checked));
    });
  </script>
</body>
</html>
